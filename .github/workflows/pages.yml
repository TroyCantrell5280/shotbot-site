name: Update published page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download the built page
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 -o index.html https://paste.rs/R1eBe
          curl -fsSL --retry 5 --retry-delay 2 -o styles.css https://paste.rs/3rv9K
          echo "e103adb492ab70da6a7e09e7bd21046299f9a76105b93b45e1a783b2f506b258  index.html" | sha256sum -c -
          echo "0ab9b87841ff81d94d8800e76f2455c5c05f1a02ce1b73b050da12a3548e58fb  styles.css" | sha256sum -c -
          python3 - << 'PY'
          from pathlib import Path
          css = Path("styles.css").read_text(encoding="utf-8")
          assert "text-transform" not in css
          assert "uppercase" not in css.lower()
          assert ".eyebrow" in css and "letter-spacing: normal;" in css
          assert "flex-direction: column;" in css
          assert "position: absolute" not in css.split(".board {")[1].split("}")[0]
          print("checks ok")
          PY

      - name: Replace built files on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" publish
          cp index.html styles.css publish/
          test -f publish/.nojekyll
          cd publish
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "gh-pages already matches"
          else
            git commit -m "Publish the quieter board and sentence-case labels"
            git push origin gh-pages
          fi
          git ls-tree -r --name-only HEAD

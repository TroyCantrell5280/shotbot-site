name: Update published page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download the built page
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 -o index.html https://paste.rs/WpKHA
          curl -fsSL --retry 5 --retry-delay 2 -o styles.css https://paste.rs/SweYX
          echo "e103adb492ab70da6a7e09e7bd21046299f9a76105b93b45e1a783b2f506b258  index.html" | sha256sum -c -
          echo "9c1cac3db9b571c486547d4a424a2745648c229d292bccba07d75e19f84d1978  styles.css" | sha256sum -c -
          python3 - << 'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'class="still"' in html
          assert 'class="scorecard"' in html
          assert 'class="title-line">Keep the paper.' in html
          assert html.lower().count("pricing: coming soon.") == 2
          print("checks ok")
          PY

      - name: Replace built files on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" publish
          cp index.html styles.css publish/
          test -f publish/.nojekyll
          cd publish
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "gh-pages already matches"
          else
            git commit -m "Publish the redesigned marketing page"
            git push origin gh-pages
          fi
          echo "gh-pages files:"
          git ls-tree -r --name-only HEAD

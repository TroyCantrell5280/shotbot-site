name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Download and check the built page
        run: |
          set -euo pipefail
          mkdir -p _site
          curl -fsSL --retry 5 --retry-delay 2 -o _site/index.html https://paste.rs/3elWW
          curl -fsSL --retry 5 --retry-delay 2 -o _site/styles.css https://paste.rs/5WQgW
          : > _site/.nojekyll
          echo "1d91dbf1d69a6b5374955fbe934942e93bd0fd8dfd0dd44ad0a0a0c7f1338352  _site/index.html" | sha256sum -c -
          echo "0ab7c20bd5a0f055317ed859aa849bb1fc50ca0dba750f95f953671ccc30286c  _site/styles.css" | sha256sum -c -
          python3 - << 'PY'
          from pathlib import Path
          import re
          html = Path("_site/index.html").read_text(encoding="utf-8")
          css = Path("_site/styles.css").read_text(encoding="utf-8")
          page = html.lower()
          assert page.count("pricing: coming soon.") == 2, page.count("pricing: coming soon.")
          assert "staff pick the class from that event\u2019s list on the same check-in step" in html
          assert "genesis" not in page
          assert "<form" not in page
          assert "<script" not in page
          assert "iframe" not in page
          assert "://" not in page
          assert "://" not in css.lower()
          assert re.search(r"\$\s*\d", html) is None
          print("checks ok")
          PY

      - name: Commit built files to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" publish
          rm -f publish/README.md
          cp _site/index.html _site/styles.css _site/.nojekyll publish/
          cd publish
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already matches"
          else
            git commit -m "Publish built static marketing page from main a8c21e4"
            git push origin gh-pages
          fi
          echo "gh-pages files:"
          git ls-tree -r --name-only HEAD

      - name: Enable GitHub Pages from gh-pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request() {
            local method="$1"
            local body="$2"
            local code
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
              -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d "$body")
            echo "$method -> $code" >&2
            cat /tmp/pages.json >&2
            echo >&2
            printf '%s' "$code"
          }
          code=$(request POST '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "create legacy: $code"
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "409" ]; then
            code=$(request PUT '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "update legacy: $code"
          fi
          if [ "$code" = "201" ] || [ "$code" = "200" ] || [ "$code" = "204" ] || [ "$code" = "409" ]; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            build=$(curl -sS -o /tmp/build.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds")
            echo "build request: $build"
            cat /tmp/build.json
            exit 0
          fi
          code=$(request POST '{"build_type":"workflow"}')
          echo "create workflow pages: $code"
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "409" ]; then
            code=$(request PUT '{"build_type":"workflow"}')
            echo "update workflow pages: $code"
          fi
          echo "mode=workflow" >> "$GITHUB_OUTPUT"
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "204" ] && [ "$code" != "409" ]; then
            echo "Pages API did not accept a site configuration"
            exit 1
          fi

  deploy:
    needs: publish
    if: needs.publish.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and check the built page
        run: |
          set -euo pipefail
          mkdir -p _site
          curl -fsSL --retry 5 --retry-delay 2 -o _site/index.html https://paste.rs/3elWW
          curl -fsSL --retry 5 --retry-delay 2 -o _site/styles.css https://paste.rs/5WQgW
          : > _site/.nojekyll
          echo "1d91dbf1d69a6b5374955fbe934942e93bd0fd8dfd0dd44ad0a0a0c7f1338352  _site/index.html" | sha256sum -c -
          echo "0ab7c20bd5a0f055317ed859aa849bb1fc50ca0dba750f95f953671ccc30286c  _site/styles.css" | sha256sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
